<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ôn tập Thực vật</title>
<style>
:root{--g:#16a34a;--b:#0284c7;--bg:#f2f8f5;--c:#fff;--t:#1f2937;--m:#6b7280;--bd:#d9e5df;--ok:#16a34a;--bad:#dc2626}
body.dark{--bg:#0e1916;--c:#18261f;--t:#e6f0ea;--m:#9db2a8;--bd:#2b3f37}
*{box-sizing:border-box}html{font-size:16px}
body{margin:0;font:1rem/1.55 system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--t);padding-bottom:76px;overflow-x:hidden;overflow-wrap:anywhere}
header{background:linear-gradient(90deg,var(--g),var(--b));color:#fff;padding:12px 16px;text-align:center}
header h1{margin:0;font-size:1.2rem;letter-spacing:.5px}
.w{max-width:820px;margin:0 auto;padding:12px}
h2{font-size:1.25rem;margin:.4rem 0 .8rem}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.click{cursor:pointer}.m{color:var(--m);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.st{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.st b{display:block;font-size:1.5rem;color:var(--g)}.st span{font-size:.85rem;color:var(--m)}
.btn{min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--c);color:var(--t);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:linear-gradient(90deg,var(--g),var(--b));color:#fff;border:0}
.btn.d{background:var(--bad);color:#fff;border:0}
.ic{min-width:44px;min-height:44px;border:1px solid var(--bd);background:var(--c);color:var(--t);border-radius:10px;font-size:1.1rem;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.sp{flex:1}
.row .btn{flex:1 1 auto}
.pb{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:var(--g)}
.qt{font-size:1.1rem;font-weight:600;margin:10px 0}
.opt{display:block;width:100%;text-align:left;min-height:48px;margin:8px 0;padding:10px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--c);color:var(--t);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--b);background:rgba(2,132,199,.12)}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.2)}
.opt.bad{border-color:var(--bad);background:rgba(220,38,38,.18)}
.nt{padding:10px;border-radius:10px;margin:8px 0;background:rgba(245,158,11,.18)}
.nt.ok{background:rgba(22,163,74,.18)}.nt.bad{background:rgba(220,38,38,.15)}
.tm{font-weight:700;color:var(--b)}
select,input,textarea{width:100%;min-height:44px;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--c);color:var(--t);font:inherit;margin:4px 0 10px}
label{font-weight:600;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:46px;min-height:40px;border-radius:8px;border:1px solid var(--bd);background:var(--c);color:var(--t);cursor:pointer;font:inherit}
.chip.ok{background:rgba(22,163,74,.25)}.chip.bad{background:rgba(220,38,38,.25)}.chip.sel{background:rgba(2,132,199,.25)}.chip.mk{outline:2px solid #f59e0b}.chip.cu{border:2px solid var(--b)}
.rw{border-bottom:1px solid var(--bd);padding:10px 0}.rw:last-child{border:0}
.rw.ok b.s{color:var(--ok)}.rw.bad b.s{color:var(--bad)}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;margin:8px 0}
.chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.75rem}
.chart i{display:block;width:100%;background:var(--b);border-radius:4px 4px 0 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--bd);z-index:9;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:8px 2px;font:inherit;font-size:.72rem;cursor:pointer;min-height:56px}
nav button span{display:block;font-size:1.3rem}nav button.on{color:var(--g);font-weight:700}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
</style></head><body>

function mainBtn(){const id=ss.ids[ss.i];if(ss.mode=="exam"){mv(1);return}
 if(!ss.chk[id]){const p=ss.pick[id];if(!p){alert("Hãy chọn một đáp án trước.");return}ss.chk[id]=1;const a=ans(B[id]);
  if(a){S.done[id]=p==a?1:0;if(p!=a&&!S.wrong.includes(id))S.wrong.push(id);beep(p==a)}else if(S.done[id]===undefined)S.done[id]=2;save();render()}else mv(1)}
function mv(d){const n=ss.ids.length,j=ss.i+d;if(j<0)return;if(j>=n){if(ss.mode=="exam")return;ss.fin=1;go("sum");return}ss.i=j;render();scrollTo(0,0)}
V.sum=()=>{let ok=0,bad=0,nk=0,sk=0;ss.ids.forEach(id=>{if(!ss.chk[id]){sk++;return}const a=ans(B[id]);if(!a)nk++;else if(ss.pick[id]==a)ok++;else bad++});
 return `<h2>Kết thúc phiên luyện tập</h2><div class="grid">${stc(ss.ids.length,"Tổng số câu")}${stc(ok,"Đúng")}${stc(bad,"Sai")}${stc(nk,"Chưa có đáp án")}${stc(sk,"Bỏ qua")}</div><div class="row"><button class="btn p" onclick="go(ss.back||'home')">Quay lại</button><button class="btn" onclick="go('wrong')">Xem câu sai</button></div>`};
V.exam=()=>{const last=S.hist[S.hist.length-1];
 return `<h2>Thi thử</h2><div class="card"><label>Phạm vi</label><select id="sc"><option value="all">Toàn bộ ngân hàng câu hỏi</option>${L.map((t,i)=>`<option value="l${i+1}">Bài ${i+1}: ${t}</option>`).join("")}${LV.map((t,i)=>`<option value="d${i}">${t}</option>`).join("")}</select><label>Số câu</label><select id="cn">${[20,30,50,100,150,200].map(x=>`<option>${x}</option>`).join("")}<option value="all">Tất cả câu hỏi</option></select><p class="m">Thời gian: 45 giây mỗi câu. Chỉ chấm điểm các câu đã có đáp án chuẩn; câu chưa có đáp án được thông báo riêng.</p><button class="btn p" onclick="exStart()">Bắt đầu thi</button></div>${last?`<div class="card m">Lần thi gần nhất: ${last.sc===null?"—":last.sc}/10 (${last.ok}/${last.g} câu đúng)</div>`:""}`};
function exStart(){const s=$("#sc").value;let pool=D.filter(q=>s=="all"||(s[0]=="l"&&q.lesson==+s.slice(1))||(s[0]=="d"&&q.difficulty==LV[+s.slice(1)]));
 if(!pool.length)return alert("Phạm vi này không có câu hỏi.");const c=$("#cn").value;let n=c=="all"?pool.length:+c;
 if(n>pool.length){alert(`Chỉ có ${pool.length} câu trong phạm vi này, đề thi sẽ gồm ${pool.length} câu.`);n=pool.length}
 startS(shuf(pool).slice(0,n).map(q=>q.id),"exam","exam",0,$("#sc").selectedOptions[0].text)}
function submitEx(){const n=ss.ids.length,u=n-Object.keys(ss.pick).length;if(confirm(u?`Bạn còn ${u} câu chưa làm. Vẫn nộp bài?`:"Xác nhận nộp bài?"))finish()}
function finish(){clearInterval(tmr);ss.fin=1;let ok=0,bad=0,un=0,nk=0,g=0,an=0;const rows=[];
 ss.ids.forEach(id=>{const p=ss.pick[id],a=ans(B[id]);if(p)an++;else un++;
  if(!a)nk++;else{g++;if(p==a)ok++;else if(p)bad++;if(p){S.done[id]=p==a?1:0;if(p!=a&&!S.wrong.includes(id))S.wrong.push(id)}}rows.push({id,p,a})});
 const sc=g?Math.round(ok*100/g)/10:null;ss.res={n:ss.ids.length,an,ok,bad,un,nk,g,sc,tm:ss.tot-Math.max(ss.left,0),acc:pct(ok,g),rows};
 S.hist.push({d:Date.now(),n:ss.res.n,g,ok,sc,tm:ss.res.tm,scope:ss.scope});save();go("res")}
V.res=()=>{const r=ss.res,rs=r.rows.filter(x=>resF=="all"||(x.a&&x.p!=x.a));
 return `<h2>Kết quả thi</h2><div class="grid">${stc(r.sc===null?"—":r.sc+"/10","Điểm (thang 10)")}${stc(r.acc+"%","Tỷ lệ chính xác")}${stc(r.n,"Tổng số câu")}${stc(r.an,"Đã trả lời")}${stc(r.ok,"Đúng")}${stc(r.bad,"Sai")}${stc(r.un,"Chưa trả lời")}${stc(r.nk,"Chưa có đáp án chuẩn")}${stc(tf(r.tm),"Thời gian")}</div>
 ${r.nk?`<div class="nt">⚠ ${r.nk} câu chưa có đáp án chuẩn nên không được tính điểm. Điểm tính trên ${r.g} câu có đáp án.</div>`:""}
 <div class="row"><button class="btn p" onclick="retryW()">Làm lại câu sai</button><button class="btn" onclick="resF=resF=='all'?'bad':'all';render()">${resF=="all"?"Chỉ xem câu sai":"Xem tất cả"}</button></div>
 <div class="card">${rs.map(x=>{const q=B[x.id],st=!x.a?"Chưa có đáp án":!x.p?"Chưa trả lời":x.p==x.a?"Đúng":"Sai",cl=!x.a||!x.p?"":x.p==x.a?"ok":"bad";return `<div class="rw ${cl}"><b>#${x.id}</b> ${esc(q.question.slice(0,90))}<br><span class="m">Bạn chọn: ${x.p||"—"} · Đáp án: ${x.a||"chưa có"} · </span><b class="s">${st}</b></div>`}).join("")||"Không có câu nào."}</div>`};
function retryW(){const ids=ss.res.rows.filter(x=>x.a&&x.p!=x.a).map(x=>x.id);if(!ids.length)return alert("Không có câu sai nào để làm lại.");startS(ids,"practice","res")}
V.wrong=()=>{S.wrong=S.wrong.filter(id=>B[id]);const w=S.wrong;
 if(!w.length)return `<h2>Ôn tập câu sai</h2><div class="card">Chưa có câu sai nào. Các câu bạn trả lời sai sẽ tự động được lưu ở đây.</div>`;
 return `<h2>Ôn tập câu sai (${w.length})</h2><div class="row"><button class="btn p" onclick="startS(shuf(S.wrong),'practice','wrong')">Luyện ngẫu nhiên</button><button class="btn" onclick="startS([...S.wrong],'practice','wrong')">Theo thứ tự</button></div><div class="card">${w.map(id=>rowQ(B[id],`<button class="btn" onclick="startS([${id}],'practice','wrong')">Làm lại</button><button class="btn" onclick="unwrong(${id})">Đã thuộc</button>`)).join("")}</div>`};
function unwrong(id){S.wrong=S.wrong.filter(x=>x!=id);save();render()}
V.fav=()=>{S.fav=S.fav.filter(id=>B[id]);if(!S.fav.length)return `<h2>Câu hỏi yêu thích</h2><div class="card">Chưa lưu câu nào. Bấm ☆ trên câu hỏi để lưu.</div>`;
 return `<h2>Câu hỏi yêu thích (${S.fav.length})</h2><div class="row"><button class="btn p" onclick="startS([...S.fav],'practice','fav')">Luyện tập các câu đã lưu</button></div><div class="card">${S.fav.map(id=>rowQ(B[id],`<button class="btn" onclick="startS([${id}],'practice','fav')">Làm câu này</button>${star(id)}`)).join("")}</div>`};
V.search=()=>`<h2>Tìm kiếm</h2><input id="qs" type="search" placeholder="Số câu, từ khóa, tên cây, tên khoa học, tiếng Latin…" value="${esc(sq)}" oninput="doSearch()"><div id="sr"></div>`;
function doSearch(){const el=$("#qs"),o=$("#sr");if(!el||!o)return;sq=el.value;const v=sq.trim();if(!v){o.innerHTML='<div class="m">Nhập từ khóa để tìm trong '+D.length+" câu hỏi.</div>";return}
 const k=nm(v),r=D.filter(q=>/^\d+$/.test(v)?String(q.id)==v||q._s.includes(k):q._s.includes(k));
 o.innerHTML=`<div class="m">Tìm thấy ${r.length} câu${r.length>50?" (hiển thị 50 câu đầu)":""}</div><div class="card">${r.slice(0,50).map(q=>rowQ(q,`<button class="btn" onclick="startS([${q.id}],'practice','search')">Làm câu này</button>${star(q.id)}`)).join("")||"Không có kết quả."}</div>`}
V.stats=()=>{const v=Object.values(S.done),ok=v.filter(x=>x==1).length,bad=v.filter(x=>x==0).length,weak=[];
 const bars=L.map((t,i)=>{const ids=D.filter(q=>q.lesson==i+1),dn=ids.filter(q=>S.done[q.id]!==undefined).length,g=ids.filter(q=>S.done[q.id]<2).length,o=ids.filter(q=>S.done[q.id]==1).length,acc=pct(o,g);if(g&&acc<60)weak.push(`Bài ${i+1} (${acc}%)`);
  return `<div style="margin:8px 0"><b>Bài ${i+1}</b> <span class="m">đã làm ${dn}/${ids.length} · đúng ${g?acc+"%":"—"}</span><div class="pb"><i style="width:${pct(dn,ids.length)}%"></i></div></div>`}).join("");
 const H=S.hist.slice(-12);
 return `<h2>Thống kê học tập</h2><div class="grid">${stc(v.length,"Đã làm")}${stc(ok,"Đúng")}${stc(bad,"Sai")}${stc(pct(ok,ok+bad)+"%","Tỷ lệ chính xác")}</div><div class="card"><b>Tiến độ từng bài</b>${bars}</div>
 <div class="card"><b>Bài có kết quả thấp (&lt;60%)</b><div>${weak.join(", ")||"Chưa có"}</div></div>
 <div class="card"><b>Điểm các lần thi thử gần đây</b>${H.length?`<div class="chart">${H.map(h=>`<div><small>${h.sc===null?"-":h.sc}</small><i style="height:${(h.sc||0)*10}%"></i></div>`).join("")}</div>`:'<div class="m">Chưa có lần thi nào.</div>'}${S.hist.slice().reverse().slice(0,15).map(h=>`<div class="rw">${new Date(h.d).toLocaleString("vi-VN")} · <b>${h.sc===null?"—":h.sc}/10</b> · ${h.ok}/${h.g} đúng · ${h.n} câu · ${tf(h.tm)}<div class="m">${esc(h.scope||"")}</div></div>`).join("")}</div>`};
V.set=()=>`<h2>Cài đặt</h2><div class="card"><label>Giao diện</label><button class="btn" onclick="S.dark=S.dark?0:1;save();theme();render()">${S.dark?"☀ Chuyển sang sáng":"🌙 Chuyển sang tối"}</button><div style="height:10px"></div><label>Cỡ chữ</label><select onchange="S.font=+this.value;save();theme()">${[[14,"Nhỏ"],[16,"Vừa"],[18,"Lớn"],[20,"Rất lớn"]].map(f=>`<option value="${f[0]}" ${S.font==f[0]?"selected":""}>${f[1]}</option>`).join("")}</select><label><input type="checkbox" style="width:auto;min-height:0" ${S.snd?"checked":""} onchange="S.snd=this.checked?1:0;save()"> Bật âm thanh thông báo</label></div>
 <div class="card"><label>Nhập đáp án hàng loạt (đã bổ sung: ${Object.keys(S.ans).length} câu)</label><textarea id="bulk" rows="4" placeholder="Ví dụ: 1B, 2B, 3C, 4B hoặc mỗi dòng một câu: 5 A"></textarea><button class="btn" onclick="bulk()">Áp dụng đáp án</button></div>
 <div class="card"><div class="row"><button class="btn d" onclick="resetP()">Xóa tiến độ học tập</button><button class="btn" onclick="restoreD()">Khôi phục dữ liệu mặc định</button></div><div class="m">Xóa tiến độ: xóa câu đã làm, câu sai, yêu thích, lịch sử thi. Khôi phục mặc định: xóa đáp án bổ sung và đưa cài đặt về ban đầu.</div></div>`;
function bulk(){let c=0;const re=/(\d+)\s*[:.\-=)]?\s*([A-Da-d])\b/g;let m;const t=$("#bulk").value;while((m=re.exec(t))){const id=+m[1];if(B[id]){S.ans[id]=m[2].toUpperCase();c++}}save();alert(c?`Đã áp dụng đáp án cho ${c} câu.`:"Không nhận ra câu nào hợp lệ.");render()}
function resetP(){if(confirm("Xóa toàn bộ tiến độ học tập, câu sai, yêu thích và lịch sử thi?")){S.done={};S.wrong=[];S.fav=[];S.hist=[];S.time=0;save();render()}}
function restoreD(){if(confirm("Xóa đáp án đã bổ sung và đặt lại cài đặt?")){S.ans={};S.dark=0;S.font=16;S.snd=1;save();theme();render()}}
setInterval(()=>{if(!document.hidden){S.time+=5;save()}},5000);
theme();render();
</script></body></html>
